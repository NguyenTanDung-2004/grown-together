services:
  #db_userservice:
  db_userservice:
    image: mysql:latest
    container_name: outbox_pattern
    environment:
      - MYSQL_ROOT_PASSWORD=12345
      - MYSQL_DATABASE=outbox_pattern # this line is used to create the database
    ports:
      - "3307:3306"                                      
    networks:
      - grown-together
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s     # Check health every 10 seconds
      timeout: 5s       # Wait 5 seconds for a response
      retries: 3      

  #kafka
  kafka:
    image: 'bitnami/kafka:3.7.0'
    container_name: kafka_growntogether
    hostname: kafka
    ports:
      - '9094:9094'
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER  

networks:
  grown-together:  
    driver: bridge